name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar o Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compilar o projeto com Maven
        run: mvn clean package -DskipTests

      - name: Enviar o .jar para a AWS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "target/gymiq-backend-0.0.1-SNAPSHOT.jar"
          target: "/home/ec2-user/"
          strip_components: 1

      - name: Reiniciar a aplicacao na AWS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            killall -9 java || true
            nohup bash -c "set -a && source /home/ec2-user/.env && exec java -Duser.timezone=America/Sao_Paulo -jar /home/ec2-user/gymiq-backend-0.0.1-SNAPSHOT.jar" > /home/ec2-user/app.log 2>&1 &